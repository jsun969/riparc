<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>riparc</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px system-ui, sans-serif;
      }
      body {
        margin: 16px;
        min-width: 280px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 0;
      }
      input {
        width: 5em;
      }
    </style>
  </head>
  <body>
    <label>Tabs to cycle <input data-setting="cycleSize" type="number" /></label>
    <label>Highlight delay (ms) <input data-setting="highlightDelayMs" type="number" /></label>
    <label>Highlight while switching <input data-setting="highlightWhileSwitching" type="checkbox" /></label>
    <label>Peek on Shift+click <input data-setting="peekEnabled" type="checkbox" /></label>
    <label>Close peek on focus loss <input data-setting="peekCloseOnBlur" type="checkbox" /></label>
    <label>Open peek as tab <button id="expand-peek-shortcut" type="button"></button></label>
    <script type="module" src="options.js"></script>
  </body>
</html>
